name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Use Node.js 24.x
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm run audit

      # Workspace dependents link to each dependency's dist/, so build (in
      # dependency order) before type-checking or testing.
      - name: Build
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Check types
        run: pnpm run check-types

      - name: Install algokit
        run: pipx install algokit

      - name: Start LocalNet
        run: |
          algokit localnet start
          npx --yes wait-on tcp:4001 -t 30000

      - name: Test
        run: pnpm run test

      - name: Build docs
        run: |
          pnpm --dir algokit-utils-ts run docs:build
          pnpm --dir algokit-subscriber-ts run docs:build
