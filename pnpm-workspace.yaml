packages:
  - algokit-client-generator-ts
  - algokit-subscriber-ts
  - algokit-subscriber-ts/docs
  - algokit-utils-ts
  - algokit-utils-ts/docs
  - tooling

# Only install package versions that have been published for at least 7 days (in minutes).
# Replaces the per-package `.npmrc` `min-release-age=7`.
minimumReleaseAge: 10080

# Dependencies allowed to run install scripts.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: ^0.35.5

# Between stable releases the workspace packages carry prerelease versions (e.g. `9.2.3-beta.1`), which peer ranges
# like `^9.0.0` never match, so accept any version of the linked workspace copy.
peerDependencyRules:
  allowedVersions:
    '@algorandfoundation/algokit-utils': '*'
    '@algorandfoundation/algokit-client-generator': '*'

# Merged from the `overrides` of the individual packages. pnpm applies overrides workspace-wide.
overrides:
  ajv@^6: ^6.15.0
  brace-expansion: ^5.0.12
  cross-spawn: '>=7.0.5'
  esbuild: 0.25.0
  fast-uri: '>=4.1.5'
  handlebars: ^4.7.10
  js-yaml: ^4.3.2
  minimatch@^3: ^3.1.5
  picomatch: ^4.0.5
  postcss: '>=8.5.23'
  undici@^7: ^7.30.1

# Accepted audit findings (previously tracked per package in `.nsprc` for better-npm-audit).
auditConfig:
  ignoreGhsas:
    # minimatch globparts-amplification DoS. Fixed only in minimatch 11 (first published 2026-10-27, still inside
    # `minimumReleaseAge`), with no backport to the 3/7/9/10 lines used by eslint, typedoc, rimraf, ts-node-dev and
    # tealscript, so a fix would need a major-version override. Reached only through dev/docs tooling matching
    # repo-controlled patterns. Not shipped in any published package. Review 2026-12-01.
    - GHSA-g3hv-75wg-m249
    # glob AbortSignal cancellation bypass. Fixed only in glob 14.0.2 (published 2026-10-27, still inside
    # `minimumReleaseAge`), with no backport to the 10/13 lines used by rimraf and tealscript. Reached only through
    # dev tooling, which never passes an AbortSignal. Not shipped in any published package. Review 2026-12-01.
    - GHSA-3g3m-2fjr-6pw4

# All external dependency versions live here; package.json files reference them with `"<dep>": "catalog:"`.
# `strict`: `pnpm add` writes `catalog:` (adding new deps to the catalog) and rejects versions outside the catalog range.
# Peer dependency ranges are deliberately kept in each package.json, as they express each package's minimum supported version.
catalogMode: strict
catalog:
  '@algorandfoundation/tealscript': ^0.107.2
  '@astrojs/markdown-remark': ^7.3.4
  '@astrojs/starlight': ^0.42.7
  '@eslint/js': ^10.0.1
  '@noble/ed25519': ^3.2.0
  '@prisma/client': ^5.15.1
  '@tsconfig/node22': ^22.0.6
  '@types/json-bigint': ^1.0.4
  '@types/mdast': ^4.0.4
  '@types/node': ^26.6.4
  '@types/uuid': ^10.0.0
  '@vitest/coverage-v8': ^4.1.12
  astro: ^7.4.2
  buffer: ^6.0.3
  chalk: ^5.4.1
  change-case: ^5.4.4
  commander: ^14.0.0
  cpy-cli: ^7.0.0
  cross-env: ^7.0.3
  dotenv-cli: ^7.4.4
  eslint: ^10.12.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-unused-imports: ^4.3.0
  fast-glob: ^3.3.3
  hi-base32: ^0.5.1
  js-sha512: ^0.9.0
  json-schema-to-typescript: ^15.0.4
  jsonschema: ^1.5.0
  npm-run-all2: ^8.0.4
  prettier: ^3.9.9
  prisma: ^5.15.1
  remark-github-alerts: ^0.1.1
  replace-in-files-cli: ^3.0.0
  rimraf: ^6.1.3
  rolldown: ^1.0.0-rc.12
  sharp: ^0.35.5
  starlight-typedoc: ^0.23.1
  tiny-invariant: ^1.3.3
  ts-node-dev: ^2.0.0
  tsd: ^0.33.0
  tsx: ^4.23.15
  typedoc: ^0.28.20
  typedoc-plugin-markdown: ^4.13.1
  typescript: ^6.0.3
  typescript-eslint: ^8.71.1
  unist-util-visit: ^5.1.0
  uuid: ^14.0.0
  vitest: ^4.1.12
  vitest-fetch-mock: ^0.4.5
  yaml: ^2.9.1
