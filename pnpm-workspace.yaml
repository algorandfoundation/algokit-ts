  shx: ^0.4.0
  starlight-typedoc: ^0.21.5
  tiny-invariant: ^1.3.3
  ts-node: ^10.9.1
  ts-node-dev: ^2.0.0
  tsd: ^0.33.0
  tslib: ^2.8.1
  tsx: ^4.23.15
